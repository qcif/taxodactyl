name: mock-nf-test

on:
  push:
    branches:
      - nf-tests_ci_core
  pull_request:
  workflow_dispatch:

# Cancel a run if a newer one is started for the same branch/PR (see nf-test-rnaseq.yml)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NXF_ANSI_LOG: false
  NFT_VER: "0.9.5"
  MOCK_BLAST: false

jobs:
  nf-test:
    name: core_test
    runs-on: ubuntu-latest
    environment: testing
    # Can extend strategy in the future for different versions + nf-test ver
    strategy:
      matrix:
        python-version: [3.12]
        nextflow-version: [25.04.6]

    steps:
      # Enable creation of containers as an unprivileged user
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Fetch the repo so nf-test.config, test/, and workflows/ are on disk
      - uses: actions/checkout@v4

      - name: Download mock test folder
        run: |
          wget -q https://daffstandard.blob.core.windows.net/test-data/taxodactyl/core/fixtures/nf-test/mock_test_20260804.tar.gz
          mkdir -p ${{ runner.temp }}/nf-test/tests/mock-test
          tar -xvf mock_test_20260804.tar.gz -C ${{ runner.temp }}/nf-test/tests/mock-test
          tree ${{ runner.temp }}/nf-test/tests

      # Test folder ends in unknown hash; set as env var here for later steps
      - name: Set test folder as env var
        run: |
          dirs=(${{ runner.temp }}/nf-test/tests/*)
          test_dir="${dirs[0]}"
          echo "TEST_DIR=$test_dir" >> $GITHUB_ENV
          echo "The test directory is $TEST_DIR"

      - name: Set up Python
        if: always()
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Summarise nf-test errors
        if: always()
        run: |
          python $GITHUB_WORKSPACE/bin/diff_json_snapshot_to_csv.py \
            ${{ runner.temp }}/nf-test/nf-test_errors.txt
          echo "#### ${{ runner.temp }}/nf-test/nf-test_errors.txt"
          cat ${{ runner.temp }}/nf-test/nf-test_errors.txt
          echo "#### ${{ runner.temp }}/nf-test/nf-test_errors_summary.csv"
          cat ${{ runner.temp }}/nf-test/nf-test_errors_summary.csv

      - name: Test flags
        id: test-flags
        if: always()
        run: |
          baseline_dir=$GITHUB_WORKSPACE/test/core/flags
          echo "baseline_dir = $baseline_dir"

          # There will only ever be one test hash in the tests folder
          dirs=(${{ runner.temp }}/nf-test/tests/*)
          evaluated_dir="${dirs[0]}"
          echo "evaluated_dir = $evaluated_dir"

          mkdir -p ${{ runner.temp }}/nf-test/flags/evaluated
          echo "collect_flags.sh: Flags from test run will be collected to ${{ runner.temp }}/nf-test/flags/evaluated"

          bash $GITHUB_WORKSPACE/bin/collect_flags.sh \
            $evaluated_dir \
            ${{ runner.temp }}/nf-test/flags/evaluated

          echo "test_flags.py: Flag results and errors will be saved to ${{ runner.temp }}/nf-test/flags_results.txt | flags_errors.txt"
          python $GITHUB_WORKSPACE/bin/test_flags.py \
            $baseline_dir \
            ${{ runner.temp }}/nf-test/flags/evaluated \
            > ${{ runner.temp }}/nf-test/flags_results.txt \
            2> ${{ runner.temp }}/nf-test/flags_errors.txt

          echo "#### ${{ runner.temp }}/nf-test/flags_results.txt"
          cat ${{ runner.temp }}/nf-test/flags_results.txt

          echo "#### ${{ runner.temp }}/nf-test/flags_errors.txt"
          cat ${{ runner.temp }}/nf-test/flags_errors.txt

      - name: Debug failed test flags
        # Only runs if test-flags step fails or if in debug mode
        if: ${{ always() && (steps.test-flags.outcome == 'failure' || runner.debug == '1') }}
        run: |
          echo "#### ${{ runner.temp }}/nf-test/flags_results.txt"
          cat ${{ runner.temp }}/nf-test/flags_results.txt

          echo "#### ${{ runner.temp }}/nf-test/flags_errors.txt"
          cat ${{ runner.temp }}/nf-test/flags_errors.txt
          
          echo "#### tree -a ${{ runner.temp }}/nf-test/:"
          tree -a ${{ runner.temp }}/nf-test/

      # Selenium pytest test_reports.py requires all reports in a dir
      - name: Soft link reports for pytest
      # Always run, nothing will happen if there are no reports in output
        if: always()
        run: |
          src_dir=$TEST_DIR/output"
          echo "Dir to be searched $src_dir"

          dest_dir=$TEST_DIR/output/reports
          echo "Reports will be soft linked to dir $dest_dir"

          mkdir -p dest_dir

          # Find all "report*.html" files and link them into dest_dir
          find "$src_dir" -type f -name "report*.html" | while IFS= read -r file; do
              base_name=$(basename "$file")
              dest_path="$dest_dir/$base_name"

              # Skip if link or file already exists
              if [[ -e "$dest_path" ]]; then
                  echo "Skipping: $dest_path already exists."
                  continue
              fi

              ln -s "$file" "$dest_path"
              echo "Linked: $file -> $dest_path"
          done

        # Install pytest and dependencies for running selenium
      - name: Install pytest
        if: always()
        run: |
          cd test/selenium
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Run test_reports.py
        if: always()
        run: |
          reports_dir=$TEST_DIR/output/reports

          # Check if the folder contains at least one report
          if [ -n "$(find "$reports_dir" -mindepth 1 -print -quit)" ]; then
            echo "Running pytest"
            pytest test_reports.py -v --dir "$reports_dir"
            echo "Running ./testkit.py render"
            ./testkit.py render
          else
              echo "Reports folder is empty."
          fi

      - name: Upload review.html
        uses: actions/upload-artifact@v4
        if: always()
        with:
          path: |
            $GITHUB_WORKSPACE/test/selenium/review.html