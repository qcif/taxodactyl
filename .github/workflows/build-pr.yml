name: build-pr
# Builds a neoformit/taxodactyl:<branch> image when a PR changes the Python
# scripts. nf-test runs against that image (or :main if unchanged) only when
# the "nf-test" label is added to the PR; the label is removed when the run
# finishes, so adding it again starts a new run.
# The branch tag is deleted from Docker Hub when the PR is closed.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed, labeled]

# Pushes, reopen and close share one group, so a newer push cancels an older
# build. An nf-test label run has its own group: a push or another label
# doesn't cancel it, and adding the label again restarts it. Other labels
# get a unique group (nothing runs for them)
concurrency:
  group: build-pr-${{ github.event.pull_request.number }}-${{ github.event.action != 'labeled' && 'build' || github.event.label.name == 'nf-test' && 'nf-test' || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_REPO: neoformit/taxodactyl

jobs:
  build:
    if: >-
      github.event.action != 'closed'
      && (github.event.action != 'labeled' || github.event.label.name == 'nf-test')
    runs-on: ubuntu-latest
    # Output the tag only: the repo name contains DOCKER_USERNAME, and GitHub
    # silently drops job outputs that contain a secret value
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same paths as build-main.yml: only rebuild if the image would differ
      - name: Detect Python changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed_files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "$changed_files"
          if echo "$changed_files" | grep -qE \
            '^scripts/(.*\.py|Dockerfile|requirements\.txt|config/.*)$'
          then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Branch names are untrusted, so pass via env and sanitise for docker
      - name: Compute image tag
        id: tag
        env:
          HEAD_REF: ${{ github.head_ref }}
          CHANGED: ${{ steps.changes.outputs.changed }}
        run: |
          if [[ "$CHANGED" == "true" ]]; then
            tag=$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-128)
          else
            tag="main"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=docker.io/$IMAGE_REPO:$tag" >> "$GITHUB_OUTPUT"
          echo "Tag for nf-test: $tag"

      - name: Log in to Docker Hub
        if: steps.changes.outputs.changed == 'true'
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        if: steps.changes.outputs.changed == 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          cd scripts
          docker build -t "$IMAGE" -f Dockerfile .
          docker push "$IMAGE"

      - name: Verify image exists remotely
        if: steps.changes.outputs.changed == 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: docker manifest inspect "$IMAGE" > /dev/null

  nf-test:
    needs: build
    if: github.event.action == 'labeled' && github.event.label.name == 'nf-test'
    uses: ./.github/workflows/nf-test.yml
    with:
      # env context isn't available here, so the repo is spelled out
      image: docker.io/neoformit/taxodactyl:${{ needs.build.outputs.tag }}
    secrets: inherit

  # Remove the label when nf-test passes or fails, so adding it again re-runs
  # nf-test. Not when cancelled: a re-added label cancels the previous run,
  # and that run must not remove the label the new run was started by.
  # Removing a label doesn't trigger this workflow (no "unlabeled" type)
  remove-label:
    needs: nf-test
    if: ${{ !cancelled() && github.event.action == 'labeled' && github.event.label.name == 'nf-test' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove nf-test label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # 404 if someone already removed it
        run: gh api -X DELETE "repos/$REPO/issues/$PR/labels/nf-test" || true

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Delete branch tag from Docker Hub
        env:
          HEAD_REF: ${{ github.head_ref }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          tag=$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-128)

          # Never delete protected tags, whatever the branch is called
          if [[ "$tag" =~ ^(main|latest|v[0-9].*)$ ]]; then
            echo "Refusing to delete protected tag '$tag'"
            exit 0
          fi

          token=$(
            jq -n --arg u "$DOCKER_USERNAME" --arg p "$DOCKER_PASSWORD" \
              '{username: $u, password: $p}' \
            | curl -sf -X POST \
              -H "Content-Type: application/json" \
              -d @- \
              https://hub.docker.com/v2/users/login \
            | jq -r .token
          )
          echo "::add-mask::$token"

          status=$(
            curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: JWT $token" \
              "https://hub.docker.com/v2/repositories/$IMAGE_REPO/tags/$tag/"
          )
          case "$status" in
            204) echo "Deleted $IMAGE_REPO:$tag" ;;
            404) echo "No tag $IMAGE_REPO:$tag to delete (no image was built)" ;;
            *) echo "Failed to delete $IMAGE_REPO:$tag (HTTP $status)"; exit 1 ;;
          esac
