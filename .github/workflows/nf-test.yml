name: nf-test

on:
  push:
    branches:
      - nf-tests_ci_core
  pull_request:
  workflow_dispatch:

# Cancel a run if a newer one is started for the same branch/PR (see nf-test-rnaseq.yml)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NXF_ANSI_LOG: false
  NFT_VER: "0.9.5"

jobs:
  nf-test:
    name: core_test
    runs-on: ubuntu-latest

    steps:
      # Enable creation of containers as an unprivileged user
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Fetch the repo so nf-test.config, test/, and workflows/ are on disk
      - uses: actions/checkout@v4

      # Nextflow and nf-test both require a JVM
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # nf-test shells out to a real `nextflow` binary - it doesn't bundle one
      # Version installed on testing VM, 25.04.6, rather than latest-everything
      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: 25.04.6

      # test/core/nextflow.config runs with profile "singularity", which
      # isn't preinstalled on ubuntu-latest runners
      - name: Set up Singularity
        uses: eWaterCycle/setup-singularity@v7
        with:
          singularity-version: 3.8.7

      # nf-test is the test runner itself; pin NFT_VER above if reproducibility
      # across CI runs matters more than always testing the latest release
      - name: Install nf-test
        run: |
          wget -qO- https://get.nf-test.com | bash
          sudo mv nf-test /usr/local/bin/

      # core test scenario runs with real blast against frozen versions of
      # taxonkit and a small subset blast database  
      - name: Download taxonkit
        run: |
          wget -q https://daffstandard.blob.core.windows.net/test-data/taxodactyl/core/refdata/taxdump/2026-05-08.zip
          mkdir -p $GITHUB_WORKSPACE/test/core/refdata/taxdump
          unzip -q 2026-05-08.zip -d $GITHUB_WORKSPACE/test/core/refdata/taxdump
          tree $GITHUB_WORKSPACE/test/core/refdata

      - name: Download subset blastdb
        run: |
          wget -q https://daffstandard.blob.core.windows.net/test-data/taxodactyl/core/refdata/blastdb/2026-07-29.zip
          mkdir -p $GITHUB_WORKSPACE/test/core/refdata/blastdb
          unzip -q 2026-07-29.zip -d $GITHUB_WORKSPACE/test/core/refdata/blastdb
          tree $GITHUB_WORKSPACE/test/core/refdata/

      # The checked-in root nf-test.config points at placeholder/other scenario
      # and has a placeholder workDir - overwrite it so nf-test resolves to core 
      # and writes its working files under a real, runner-local path
      - name: Point nf-test.config at core test scenario
        run: |
          cat > nf-test.config <<CONFIG
          config {
              workDir "${{ runner.temp }}/nf-test"
              testsDir "test/core"
              configFile "test/core/nextflow.config"
              profile "singularity"
          }
          CONFIG

      # test/core/nextflow.config ships with CUSTOMISE placeholders for
      # values that depend on the runner (paths) or org-level infra (databases).
      # BLASTDB_PATH/TAXDB_PATH must be set as repository/environment variables
      # pointing at reference data reachable from this runner - mock_blast still
      # calls BLAST_BLASTDBCMD/EXTRACT_TAXONOMY against a real blastdb + taxdb.
      - name: Resolve core scenario CUSTOMISE placeholders
        run: |
          # Runner-local scratch dirs for temp files and the Singularity image cache
          mkdir -p "${{ runner.temp }}/taxodactyl" "${{ runner.temp }}/singularity"
          # Fill in each CUSTOMISE placeholder with a real value/path
          sed -i \
            -e "s|params.blastdb = CUSTOMISE|params.blastdb = \"$GITHUB_WORKSPACE/test/core/refdata/blastdb/2026-07-29/subset_core_nt\"|" \
            -e "s|params.taxdb = CUSTOMISE|params.taxdb = \"$GITHUB_WORKSPACE/test/core/refdata/taxdump/2026-05-08\"|" \
            -e "s|params.temp_root_dir = CUSTOMISE|params.temp_root_dir = \"${{ runner.temp }}/taxodactyl\"|" \
            -e "s|cacheDir = CUSTOMISE|cacheDir = \"${{ runner.temp }}/singularity\"|" \
            -e "s|env.NCBI_API_KEY = CUSTOMISE.*|env.NCBI_API_KEY = \"${{ secrets.NCBI_API_KEY }}\"|" \
            -e "s|env.USER_EMAIL = CUSTOMISE.*|env.USER_EMAIL = \"${{ secrets.USER_EMAIL_NA }}\"|" \
            test/core/nextflow.config
          # Print the resolved config so the run log shows exactly what executed
          cat test/core/nextflow.config

      # Run the core test file explicitly rather than a bare `nf-test test`,
      # so this job doesn't silently pick up whatever nf-test.config last pointed to
      - name: Run core nf-test
        run: nf-test test test/core/taxodactyl.workflow.nf.test

      # Print trace.csv, temp file structure and stage .log and .err files
      - name: Log trace work dir
        if: always()
        run: |
          echo "##### trace.csv:"
          cat /home/runner/work/_temp/nf-test/tests/*/meta/trace.csv
          echo "##### tree -a /home/runner/work/_temp/nf-test/tests/:"
          tree -a /home/runner/work/_temp/nf-test/tests/
          find /home/runner/work/_temp/nf-test/tests/ -type f \( -iname "*.log" -o -iname "*.err" \) -exec sh -c 'echo "##### $1"; cat "$1"' _ {} \;