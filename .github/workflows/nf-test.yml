name: nf-test

on:
  push:
    branches:
      - nf-tests_ci
  workflow_dispatch:

jobs:
  nf-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install nf-test
        run: |
          wget -qO- https://get.nf-test.com | bash
          sudo mv nf-test /usr/local/bin/

      - name: Run tests
        run: nf-test test