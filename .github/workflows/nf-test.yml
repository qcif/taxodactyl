name: nf-test

on:
    # Workflow runs weekly
    schedule:
      # Runs at 00:00 UTC, only on Sunday
      - cron: '0 0 * * 0'
    # Called by build-pr.yml on pull request to main, after building the
    # PR's taxodactyl image (if the PR changes the Python scripts)
    workflow_call:
      inputs:
        image:
          description: Taxodactyl image to test (default neoformit/taxodactyl:main)
          type: string
          required: false
    # Can also be triggered manually using GH UI
    workflow_dispatch:
      inputs:
        image:
          description: Taxodactyl image to test (default neoformit/taxodactyl:main)
          type: string
          required: false
        use_cache:
          description: Use cached API responses (untick to query live GBIF/NCBI APIs)
          type: boolean
          required: false
          default: true
    # Update here to enable trigger on push of selected branch
    # push:
    #   branches:
    #     - nf-test-sh-runner

# Cancel a run if a newer one is started for the same branch/PR (see nf-test-rnaseq.yml)
# Literal "nf-test-" prefix: when called from build-pr.yml, github.workflow is
# the caller's name, which would clash with build-pr's own concurrency group
concurrency:
  group: nf-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NXF_ANSI_LOG: false
  NFT_VER: "0.9.5"
  MOCK_BLAST: false
  # Frozen GBIF/NCBI API responses (SQLite cache) used as a test fixture so
  # runs don't drift with live API data (#369). Empty = no fixture yet: run
  # against live APIs. Bump both together; see test/core/README.md
  API_CACHE_VERSION: "2026-11-26"
  API_CACHE_SHA256: "1084071d621cc8c46a7a5cbda6f43c2e921a3fa1c8e7bc20c2cd717c91947df9"

jobs:
  nf-test:
    name: core_test
    runs-on: ${{ matrix.runner }}
    environment: testing
    # Read by conf/process.config to select the taxodactyl container
    env:
      TAXODACTYL_IMAGE: ${{ inputs.image || 'docker.io/neoformit/taxodactyl:main' }}
    # Can extend strategy in the future for different versions + nf-test ver
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.12]
        nextflow-version: [25.04.6]
        # Currently only running on self-hosted (sh) runner. 
        # Add "ubuntu-24.04" here to run on github-hosted runner.
        runner: [self-hosted]

    steps:
      # Singularity (rootfs-*) and Chrome/Selenium (com.google.*) leave dirs
      # behind in /tmp. Remove any older than an hour so concurrent runs
      # aren't affected. sudo is needed as rootfs contents may be read-only.
      - name: Clean up stale /tmp dirs
        if: always()
        continue-on-error: true
        run: |
          # Trailing slash: /tmp may be a symlink (e.g. -> /mnt/data/tmp)
          sudo find /tmp/ -maxdepth 1 -type d \
            \( -name 'rootfs*' -o -name 'com.google*' \) \
            -mmin +60 \
            -print \
            -exec rm -rf {} +

      # Enable creation of containers as an unprivileged user
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Fetch the repo so nf-test.config, test/, and workflows/ are on disk
      - uses: actions/checkout@v7

      # cached: install the pinned API-cache fixture before the run.
      # live: start from an empty cache (use_cache=false, or no fixture pinned)
      - name: Select API cache mode
        env:
          USE_CACHE: ${{ inputs.use_cache }}
        run: |
          if [[ "$USE_CACHE" == "false" ]]; then
            mode=live
          elif [[ -z "$API_CACHE_VERSION" ]]; then
            mode=live
            echo "::warning::No API cache fixture pinned (API_CACHE_VERSION is empty); querying live APIs"
          else
            mode=cached
          fi
          echo "API_CACHE_MODE=$mode" >> "$GITHUB_ENV"
          echo "API cache mode: $mode"

      # Record which code was tested, saved with the run files on the
      # self-hosted runner. On pull_request events the checked-out commit is a
      # temporary merge commit, so the PR head commit is recorded too.
      # Values are passed via env (not inlined) as branch names are untrusted.
      - name: Record run info
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/nf-test"
          {
            echo "event: $GITHUB_EVENT_NAME"
            echo "branch: $HEAD_REF"
            echo "checkout_sha: $(git rev-parse HEAD)"
            echo "pr_head_sha: ${PR_HEAD_SHA:-n/a}"
            echo "run_url: $RUN_URL"
            echo "image: $TAXODACTYL_IMAGE"
            echo "api_cache: $API_CACHE_MODE"
            echo "api_cache_version: ${API_CACHE_VERSION:-none}"
          } | tee "$RUNNER_TEMP/nf-test/run_info.txt"

      # Ensure the latest build of the image under test is pulled
      - name: Force pull latest Docker image
        run: docker pull "$TAXODACTYL_IMAGE"
        continue-on-error: true

      # nf-test shells out to a real `nextflow` binary - it doesn't bundle one
      # Version installed on testing VM, 25.04.6, rather than latest-everything
      # (later versions use stricter syntax parsing)
      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nextflow-version }}

      # test/core/nextflow.config runs with profile "singularity", which
      # isn't preinstalled on ubuntu-latest runners
      - name: Set up Singularity
        uses: eWaterCycle/setup-singularity@v7
        with:
          singularity-version: 3.8.7

      # nf-test is the test runner itself; pin NFT_VER above if reproducibility
      # across CI runs matters more than always testing the latest release
      - name: Install nf-test
        run: |
          wget -qO- https://get.nf-test.com | bash -s "$NFT_VER"
          sudo mv nf-test /usr/local/bin/

      # core test scenario runs with real blast against frozen versions of
      # taxonkit and a small subset blast database  
      - name: Download taxonkit
        run: |
          wget -q https://daffstandard.blob.core.windows.net/test-data/taxodactyl/core/refdata/taxdump/2026-05-08.zip
          mkdir -p $GITHUB_WORKSPACE/test/core/refdata/taxdump
          unzip -q 2026-05-08.zip -d $GITHUB_WORKSPACE/test/core/refdata/taxdump
          tree $GITHUB_WORKSPACE/test/core/refdata

      - name: Download subset blastdb
        run: |
          wget -q https://daffstandard.blob.core.windows.net/test-data/taxodactyl/core/refdata/blastdb/2026-07-29.zip
          mkdir -p $GITHUB_WORKSPACE/test/core/refdata/blastdb
          unzip -q 2026-07-29.zip -d $GITHUB_WORKSPACE/test/core/refdata/blastdb
          tree $GITHUB_WORKSPACE/test/core/refdata/

      # The checked-in root nf-test.config points at placeholder/other scenario
      # and has a placeholder workDir - overwrite it so nf-test resolves to core 
      # and writes its working files under a real, runner-local path
      - name: Point nf-test.config at core test scenario
        run: |
          cat > nf-test.config <<CONFIG
          config {
              workDir "$RUNNER_TEMP/nf-test"
              testsDir "test/core"
              configFile "test/core/nextflow.config"
              profile "singularity"
          }
          CONFIG

      # test/core/nextflow.config ships with CUSTOMISE placeholders for
      # values that depend on the runner (paths) or org-level infra (databases).
      # BLASTDB_PATH/TAXDB_PATH must be set as repository/environment variables
      # pointing at reference data reachable from this runner - mock_blast still
      # calls BLAST_BLASTDBCMD/EXTRACT_TAXONOMY against a real blastdb + taxdb.
      # Turns on mock blast if set in env variable
      - name: Resolve core scenario CUSTOMISE placeholders
        run: |
          # Runner-local scratch dirs for temp files, Singularity image cache
          # and nf-test workDir where log files will be saved
          mkdir -p \
            "$RUNNER_TEMP/taxodactyl" \
            "$RUNNER_TEMP/singularity" \
            "$RUNNER_TEMP/singularity-tmp" \
            "$RUNNER_TEMP/singularity-layers" \
            "$RUNNER_TEMP/nf-test"
          # Keep Singularity build scratch (rootfs-*) and layer cache out of
          # /tmp and $HOME so they are wiped with $RUNNER_TEMP after each job
          {
            echo "SINGULARITY_TMPDIR=$RUNNER_TEMP/singularity-tmp"
            echo "SINGULARITY_CACHEDIR=$RUNNER_TEMP/singularity-layers"
          } >> "$GITHUB_ENV"
          # Fill in each CUSTOMISE placeholder with a real value/path
          # and toggle mock_blast per env variable
          sed -i \
            -e "s|params.mock_blast = false|params.mock_blast = $MOCK_BLAST|" \
            -e "s|params.blastdb = CUSTOMISE|params.blastdb = \"$GITHUB_WORKSPACE/test/core/refdata/blastdb/2026-07-29/subset_core_nt\"|" \
            -e "s|params.taxdb = CUSTOMISE|params.taxdb = \"$GITHUB_WORKSPACE/test/core/refdata/taxdump/2026-05-08\"|" \
            -e "s|params.temp_root_dir = CUSTOMISE|params.temp_root_dir = \"$RUNNER_TEMP/taxodactyl\"|" \
            -e "s|cacheDir = CUSTOMISE|cacheDir = \"$RUNNER_TEMP/singularity\"|" \
            -e "s|env.NCBI_API_KEY = CUSTOMISE.*|env.NCBI_API_KEY = \"${{ secrets.NCBI_API_KEY }}\"|" \
            -e "s|env.USER_EMAIL = CUSTOMISE.*|env.USER_EMAIL = \"${{ secrets.NCBI_USER_EMAIL }}\"|" \
            test/core/nextflow.config
          # Print the resolved config so the run log shows exactly what executed
          cat test/core/nextflow.config

      # Copy the pinned fixture into this job's temp root. The run may add
      # entries (cache misses) to this copy; the published fixture is unchanged.
      # Only cache_db.sqlite is copied: each run starts with fresh throttle state
      - name: Install API cache fixture
        if: env.API_CACHE_MODE == 'cached'
        run: |
          wget -q "https://daffstandard.blob.core.windows.net/test-data/taxodactyl/core/refdata/api-cache/$API_CACHE_VERSION.zip"
          mkdir -p "$RUNNER_TEMP/api-cache" "$RUNNER_TEMP/taxodactyl/biosecurity"
          unzip -q "$API_CACHE_VERSION.zip" -d "$RUNNER_TEMP/api-cache"
          fixture="$RUNNER_TEMP/api-cache/$API_CACHE_VERSION/cache_db.sqlite"
          # Values are unpickled on read: only load the reviewed file.
          # Fails on a mismatch or an empty API_CACHE_SHA256
          echo "$API_CACHE_SHA256  $fixture" | sha256sum -c -
          # The fixture must hold the API cache only (no throttle tables)
          python3 -c "import sqlite3,sys; t=[r[0] for r in sqlite3.connect(sys.argv[1]).execute(\"select name from sqlite_master where type='table'\")]; sys.exit(0 if t==['cache'] else 'Unexpected tables in API cache fixture: %s' % t)" "$fixture"
          cp "$fixture" "$RUNNER_TEMP/taxodactyl/biosecurity/cache_db.sqlite"
          rows=$(python3 -c "import sqlite3,sys; print(sqlite3.connect(sys.argv[1]).execute('select count(*) from cache').fetchone()[0])" "$RUNNER_TEMP/taxodactyl/biosecurity/cache_db.sqlite")
          echo "API_CACHE_ROWS_BEFORE=$rows" >> "$GITHUB_ENV"
          echo "Fixture $API_CACHE_VERSION: $rows cached responses"

      # Run the core test file explicitly rather than a bare `nf-test test`
      # so this job doesn't silently pick up whatever nf-test.config last pointed to
      # print both standard output and errors to file and console 
      - name: Run core nf-test
        id: nf-test
        run: |
          nf-test test test/core/taxodactyl.workflow.nf.test \
            > >(tee $RUNNER_TEMP/nf-test/nf-test_results.txt) \
            2> >(tee $RUNNER_TEMP/nf-test/nf-test_errors.txt)

      # Rows added to the cache during the run are requests that weren't in
      # the fixture and went to the live APIs (cache misses). Read-only
      - name: Report API cache
        if: always()
        continue-on-error: true
        run: |
          db="$RUNNER_TEMP/taxodactyl/biosecurity/cache_db.sqlite"
          if [[ -f "$db" ]]; then
            rows_after=$(python3 -c "import sqlite3,sys; print(sqlite3.connect(sys.argv[1]).execute('select count(*) from cache').fetchone()[0])" "$db")
          else
            rows_after=0
          fi
          rows_before="${API_CACHE_ROWS_BEFORE:-0}"
          echo "API cache mode: ${API_CACHE_MODE:-unknown}"
          echo "API cache version: ${API_CACHE_VERSION:-none}"
          echo "Cached responses before run: $rows_before"
          echo "Cached responses after run: $rows_after"
          if [[ "$API_CACHE_MODE" == "cached" ]] && (( rows_after > rows_before )); then
            echo "::warning::$((rows_after - rows_before)) API responses were not in fixture $API_CACHE_VERSION and were fetched live; results may drift. Consider a new fixture version"
          fi

      # Compacted, WAL-free copy of this run's API cache, saved with the run
      # files on the self-hosted runner (candidate for a new fixture version).
      # Never uploaded as a GitHub artifact: it hasn't been checked for secrets
      - name: Save API cache
        if: always()
        continue-on-error: true
        run: |
          src="$RUNNER_TEMP/taxodactyl/biosecurity/cache_db.sqlite"
          dest="$RUNNER_TEMP/nf-test/api_cache/cache_db.sqlite"
          if [[ -f "$src" ]]; then
            mkdir -p "$(dirname "$dest")"
            python3 -c "import sqlite3,sys; sqlite3.connect(sys.argv[1]).execute('VACUUM INTO ?', (sys.argv[2],))" \
              "$src" "$dest"
            # Keep the copy only if it holds the API cache table and nothing else
            if python3 -c "import sqlite3,sys; t=[r[0] for r in sqlite3.connect(sys.argv[1]).execute(\"select name from sqlite_master where type='table'\")]; sys.exit(0 if t==['cache'] else 'Unexpected tables: %s' % t)" "$dest"; then
              sha256sum "$dest"
            else
              rm -f "$dest"
              echo "::warning::Saved API cache had unexpected tables; copy discarded"
            fi
          else
            echo "No API cache at $src; nothing to save"
          fi

      # Test dir ends in unknown hash; set as env var here for later steps
      - name: Set test dir as env var
        if: always ()
        run: |
          dirs=($RUNNER_TEMP/nf-test/tests/*)
          test_dir="${dirs[0]}"
          echo "TEST_DIR=$test_dir" >> $GITHUB_ENV
          echo "Saved test dir ending in hash as env var for future steps."
          echo "TEST_DIR=$test_dir"

      # Print trace.csv, temp file structure and command.err files
      - name: Debug failed nf-test
        # Only runs if nf-test step fails or if in debug mode
        if: always() && (steps.nf-test.outcome == 'failure' || runner.debug == '1')
        run: |
          echo "##### trace.csv:"
          cat $TEST_DIR/meta/trace.csv
          echo "##### tree -a $RUNNER_TEMP/nf-test/tests/:"
          tree -a $RUNNER_TEMP/nf-test/tests/
          find $RUNNER_TEMP/nf-test/tests/ \
            -type f -name ".command.err" \
            -exec sh -c 'echo "##### $1"; cat "$1"' _ {} \;

      - name: Set up Python
        if: always()
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      # Convert nf-test JSON snapshot errors into a CSV review file
      - name: Summarise nf-test errors
        if: always()
        run: |
          python $GITHUB_WORKSPACE/bin/diff_json_snapshot_to_csv.py \
            $RUNNER_TEMP/nf-test/nf-test_errors.txt
          echo "#### $RUNNER_TEMP/nf-test/nf-test_errors.txt"
          cat $RUNNER_TEMP/nf-test/nf-test_errors.txt
          echo "#### $RUNNER_TEMP/nf-test/nf-test_errors_summary.csv"
          cat $RUNNER_TEMP/nf-test/nf-test_errors_summary.csv

      # Compare the evaluated flags against the baseline test flags.
      - name: Test flags
        id: test-flags
        if: always()
        run: |
          set +e

          baseline_dir=$GITHUB_WORKSPACE/test/core/flags
          echo "baseline_dir = $baseline_dir"

          evaluated_dir=$TEST_DIR
          echo "evaluated_dir = $evaluated_dir"

          mkdir -p $RUNNER_TEMP/nf-test/flags/evaluated
          echo "collect_flags.sh: Flags from test run will be collected to $RUNNER_TEMP/nf-test/flags/evaluated"

          bash $GITHUB_WORKSPACE/bin/collect_flags.sh \
            $evaluated_dir \
            $RUNNER_TEMP/nf-test/flags/evaluated

          echo "test_flags.py: Flag results and errors will be saved to $RUNNER_TEMP/nf-test/flags_results.txt | flags_errors.txt"
          python $GITHUB_WORKSPACE/bin/test_flags.py \
            $baseline_dir \
            $RUNNER_TEMP/nf-test/flags/evaluated \
            > $RUNNER_TEMP/nf-test/flags_results.txt \
            2> $RUNNER_TEMP/nf-test/flags_errors.txt
          flags_status=$?

          echo "#### $RUNNER_TEMP/nf-test/flags_results.txt"
          cat $RUNNER_TEMP/nf-test/flags_results.txt

          echo "#### $RUNNER_TEMP/nf-test/flags_errors.txt"
          cat $RUNNER_TEMP/nf-test/flags_errors.txt
          exit "$flags_status"

      # Copies work directories for process/samples with failed/aborted nf-test, 
      # diff flags or diff snapshots (may be large number!) to single dir with
      # human readable PROCESS/SAMPLE file structure.
      - name: Copy error workdirs
        id: copy-workdirs
        # Always run, nothing will happen if 
        if: always()
        run: |
          # On the self-hosted runner, the whole work dir is copied and saved, 
          # so only links are required in the collected errors
          if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" ]]; then
            MODE="link"
          else
            MODE="copy"
          fi
          mkdir -p $RUNNER_TEMP/nf-test/collected_errors

          python $GITHUB_WORKSPACE/bin/collect_artifacts.py \
              $TEST_DIR/meta/trace.csv \
              --outdir=$RUNNER_TEMP/nf-test/collected_errors \
              --flags_results=$RUNNER_TEMP/nf-test/flags_results.txt \
              --nft_errors=$RUNNER_TEMP/nf-test/nf-test_errors_summary.csv \
              --mode=$MODE

      - name: Debug copy error workdirs
        # Only runs if copy-workdirs step fails or runner is in debug mode
        if: always() && (steps.copy-workdirs.outcome == 'failure' || runner.debug == '1')
        run: |
          echo "##### tree -a $RUNNER_TEMP/nf-test/collected_errors/:"
          tree -a $RUNNER_TEMP/nf-test/collected_errors/

      # Selenium pytest test_reports.py requires all reports in a dir
      - name: Soft link reports for pytest
        # Always run, nothing will happen if there are no reports in output
        if: always()
        run: |
          src_dir=$TEST_DIR/output
          echo "Dir to be searched $src_dir"

          dest_dir=$TEST_DIR/output/reports
          echo "Reports will be soft linked to dir $dest_dir"

          mkdir -p $dest_dir

          # Find all "report*.html" files and link them into dest_dir
          find "$src_dir" -type f -name "report*.html" | while IFS= read -r file; do
              base_name=$(basename "$file")
              dest_path="$dest_dir/$base_name"

              # Skip if link or file already exists
              if [[ -e "$dest_path" ]]; then
                  echo "Skipping: $dest_path already exists."
                  continue
              fi

              ln -sr "$file" "$dest_path"
              echo "Linked: $file -> $dest_path"
          done

          echo "#### tree $TEST_DIR/output/reports"
          tree $TEST_DIR/output/reports

      - name: Zip reports
        if: always()
        run: |
          cd $TEST_DIR/output
          zip -r reports.zip reports/

      # Install pytest and dependencies for running selenium
      - name: Install and run pytest
        if: always()
        run: |
          set +e
          
          cd test/selenium
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

          reports_dir=$TEST_DIR/output/reports

          # Check if the folder contains at least one report
          if [ -n "$(find "$reports_dir" -mindepth 1 -print -quit)" ]; then
            echo "Running pytest"
            pytest test_reports.py -v --dir "$reports_dir"
            pytest_status=$?
            echo "Running ./testkit.py render"
            ./testkit.py render

            # Copy the review.html to the test dir for sh runner inspection
            cp review.html $RUNNER_TEMP/nf-test/

            # Always return pytest exit status as the step status
            exit "$pytest_status"
          else
              echo "Reports folder is empty."
              exit 1
          fi

      # archive: false uploads the file as-is (no zip); the artifact takes
      # the file's own name and the `name` input is ignored
      - name: Upload review.html
        uses: actions/upload-artifact@v7
        if: always()
        with:
          path: ${{ github.workspace }}/test/selenium/review.html
          archive: false

      - name: Upload test-report.json
        uses: actions/upload-artifact@v7
        if: always()
        with:
          path: ${{ github.workspace }}/test/selenium/test-report.json
          archive: false

      - name: Upload reports
        uses: actions/upload-artifact@v7
        if: always() && runner.environment == 'github-hosted'
        with:
          name: reports
          path: ${{ env.TEST_DIR }}/output/reports

      # Copies entire work directory including test outputs to a dedicated
      # location (/var/runner/) on the self-hosted runner VM
      - name: Save run files on self-hosted runner
      # Only runs on self-hosted runner
        if: always() && runner.environment == 'self-hosted'
        run: |
          # Run files saved using key of run number and run attempt
          dir_name="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          mkdir -p "/var/runner/$dir_name"

          cp -a $RUNNER_TEMP/nf-test/. /var/runner/$dir_name/
          mv $TEST_DIR/output/reports.zip /var/runner/$dir_name/

          echo "Location of files on self-hosted runner:"
          echo "/var/runner/$dir_name/"

          echo "Download reports with:"
          echo "    scp ubuntu@daff-runner:/var/runner/$dir_name/reports.zip ."
