name: nf-test

# If not running on push, check workflow is enabled on GH UI
on:
  push:
    branches:
      - nf-tests_ci_core
  pull_request:
  workflow_dispatch:

# Cancel a run if a newer one is started for the same branch/PR (see nf-test-rnaseq.yml)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NXF_ANSI_LOG: false
  NFT_VER: "0.9.5"
  MOCK_BLAST: false

jobs:
  nf-test:
    name: core_test
    runs-on: ubuntu-latest
    environment: testing
    # Can extend strategy in the future for different versions + nf-test ver
    strategy:
      matrix:
        python-version: [3.12]
        nextflow-version: [25.04.6]

    steps:
      # Enable creation of containers as an unprivileged user
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Fetch the repo so nf-test.config, test/, and workflows/ are on disk
      - uses: actions/checkout@v4

      # Nextflow and nf-test both require a JVM
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # nf-test shells out to a real `nextflow` binary - it doesn't bundle one
      # Version installed on testing VM, 25.04.6, rather than latest-everything
      # (later versions use stricter syntax parsing)
      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nextflow-version }}

      # test/core/nextflow.config runs with profile "singularity", which
      # isn't preinstalled on ubuntu-latest runners
      - name: Set up Singularity
        uses: eWaterCycle/setup-singularity@v7
        with:
          singularity-version: 3.8.7

      # nf-test is the test runner itself; pin NFT_VER above if reproducibility
      # across CI runs matters more than always testing the latest release
      - name: Install nf-test
        run: |
          wget -qO- https://get.nf-test.com | bash
          sudo mv nf-test /usr/local/bin/

      # core test scenario runs with real blast against frozen versions of
      # taxonkit and a small subset blast database  
      - name: Download taxonkit
        run: |
          wget -q https://daffstandard.blob.core.windows.net/test-data/taxodactyl/core/refdata/taxdump/2026-05-08.zip
          mkdir -p $GITHUB_WORKSPACE/test/core/refdata/taxdump
          unzip -q 2026-05-08.zip -d $GITHUB_WORKSPACE/test/core/refdata/taxdump
          tree $GITHUB_WORKSPACE/test/core/refdata

      - name: Download subset blastdb
        run: |
          wget -q https://daffstandard.blob.core.windows.net/test-data/taxodactyl/core/refdata/blastdb/2026-07-29.zip
          mkdir -p $GITHUB_WORKSPACE/test/core/refdata/blastdb
          unzip -q 2026-07-29.zip -d $GITHUB_WORKSPACE/test/core/refdata/blastdb
          tree $GITHUB_WORKSPACE/test/core/refdata/

      # The checked-in root nf-test.config points at placeholder/other scenario
      # and has a placeholder workDir - overwrite it so nf-test resolves to core 
      # and writes its working files under a real, runner-local path
      - name: Point nf-test.config at core test scenario
        run: |
          cat > nf-test.config <<CONFIG
          config {
              workDir "$RUNNER_TEMP/nf-test"
              testsDir "test/core"
              configFile "test/core/nextflow.config"
              profile "singularity"
          }
          CONFIG

      # test/core/nextflow.config ships with CUSTOMISE placeholders for
      # values that depend on the runner (paths) or org-level infra (databases).
      # BLASTDB_PATH/TAXDB_PATH must be set as repository/environment variables
      # pointing at reference data reachable from this runner - mock_blast still
      # calls BLAST_BLASTDBCMD/EXTRACT_TAXONOMY against a real blastdb + taxdb.
      # Turns on mock blast if set in env variable
      - name: Resolve core scenario CUSTOMISE placeholders
        run: |
          # Runner-local scratch dirs for temp files, Singularity image cache
          # and nf-test workDir where log files will be saved
          mkdir -p \
            "$RUNNER_TEMP/taxodactyl" \
            "$RUNNER_TEMP/singularity" \
            "$RUNNER_TEMP/nf-test"
          # Fill in each CUSTOMISE placeholder with a real value/path
          # and toggle mock_blast per env variable
          sed -i \
            -e "s|params.mock_blast = false|params.mock_blast = $MOCK_BLAST|" \
            -e "s|params.blastdb = CUSTOMISE|params.blastdb = \"$GITHUB_WORKSPACE/test/core/refdata/blastdb/2026-07-29/subset_core_nt\"|" \
            -e "s|params.taxdb = CUSTOMISE|params.taxdb = \"$GITHUB_WORKSPACE/test/core/refdata/taxdump/2026-05-08\"|" \
            -e "s|params.temp_root_dir = CUSTOMISE|params.temp_root_dir = \"$RUNNER_TEMP/taxodactyl\"|" \
            -e "s|cacheDir = CUSTOMISE|cacheDir = \"$RUNNER_TEMP/singularity\"|" \
            -e "s|env.NCBI_API_KEY = CUSTOMISE.*|env.NCBI_API_KEY = \"${{ secrets.NCBI_API_KEY }}\"|" \
            -e "s|env.USER_EMAIL = CUSTOMISE.*|env.USER_EMAIL = \"${{ secrets.NCBI_USER_EMAIL }}\"|" \
            test/core/nextflow.config
          # Print the resolved config so the run log shows exactly what executed
          cat test/core/nextflow.config

      # Run the core test file explicitly rather than a bare `nf-test test`,
      # so this job doesn't silently pick up whatever nf-test.config last pointed to
      # print both standard output and errors to file and console 
      - name: Run core nf-test
        id: nf-test
        run: |
          nf-test test test/core/taxodactyl.workflow.nf.test \
            > >(tee $RUNNER_TEMP/nf-test/nf-test_results.txt) \
            2> >(tee $RUNNER_TEMP/nf-test/nf-test_errors.txt)

      # Test folder ends in unknown hash; set as env var here for later steps
      - name: Set test folder as env var
        run: |
          dirs=($RUNNER_TEMP/nf-test/tests/*)
          test_dir="${dirs[0]}"
          echo "TEST_DIR=$test_dir" >> $GITHUB_ENV
          echo "Saved test folder ending in unknown hash as env var for future steps."
          echo "TEST_DIR=$test_dir"

      # Print trace.csv, temp file structure and command.err files
      - name: Debug failed nf-test
        # Only runs if a nf-test step fails or if in debug mode
        if: ${{ always() && (steps.nf-test.outcome == 'failure' || runner.debug == '1') }}
        run: |
          echo "##### trace.csv:"
          cat $TEST_DIR/meta/trace.csv
          echo "##### tree -a $RUNNER_TEMP/nf-test/tests/:"
          tree -a $RUNNER_TEMP/nf-test/tests/
          find $RUNNER_TEMP/nf-test/tests/ \
            -type f -name ".command.err" \
            -exec sh -c 'echo "##### $1"; cat "$1"' _ {} \;

      - name: Set up Python
        if: always()
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Summarise nf-test errors
        if: always()
        run: |
          python $GITHUB_WORKSPACE/bin/diff_json_snapshot_to_csv.py \
            $RUNNER_TEMP/nf-test/nf-test_errors.txt
          echo "#### $RUNNER_TEMP/nf-test/nf-test_errors.txt"
          cat $RUNNER_TEMP/nf-test/nf-test_errors.txt
          echo "#### $RUNNER_TEMP/nf-test/nf-test_errors_summary.csv"
          cat $RUNNER_TEMP/nf-test/nf-test_errors_summary.csv

      - name: Test flags
        id: test-flags
        if: always()
        run: |
          set +e

          baseline_dir=$GITHUB_WORKSPACE/test/core/flags
          echo "baseline_dir = $baseline_dir"

          evaluated_dir=$TEST_DIR
          echo "evaluated_dir = $evaluated_dir"

          mkdir -p $RUNNER_TEMP/nf-test/flags/evaluated
          echo "collect_flags.sh: Flags from test run will be collected to $RUNNER_TEMP/nf-test/flags/evaluated"

          bash $GITHUB_WORKSPACE/bin/collect_flags.sh \
            $evaluated_dir \
            $RUNNER_TEMP/nf-test/flags/evaluated

          echo "test_flags.py: Flag results and errors will be saved to $RUNNER_TEMP/nf-test/flags_results.txt | flags_errors.txt"
          python $GITHUB_WORKSPACE/bin/test_flags.py \
            $baseline_dir \
            $RUNNER_TEMP/nf-test/flags/evaluated \
            > $RUNNER_TEMP/nf-test/flags_results.txt \
            2> $RUNNER_TEMP/nf-test/flags_errors.txt

          echo "#### $RUNNER_TEMP/nf-test/flags_results.txt"
          cat $RUNNER_TEMP/nf-test/flags_results.txt

          echo "#### $RUNNER_TEMP/nf-test/flags_errors.txt"
          cat $RUNNER_TEMP/nf-test/flags_errors.txt

      - name: Copy error workdirs
        id: copy-workdirs
        # Always run, nothing will happen if 
        if: always()
        run: |
          mkdir -p $RUNNER_TEMP/nf-test/collected_errors

          python $GITHUB_WORKSPACE/bin/collect_artifacts.py \
              $TEST_DIR/meta/trace.csv \
              --outdir=$RUNNER_TEMP/nf-test/collected_errors \
              --flags_results=$RUNNER_TEMP/nf-test/flags_results.txt \
              --nft-errors=$RUNNER_TEMP/nf-test/nf-test_errors_summary.csv \
              --mode="copy"

      - name: Debug copy error workdirs
        if: ${{ always() && (steps.copy-workdirs.outcome == 'failure' || runner.debug == '1') }}
        run: |
          echo "##### tree -a $RUNNER_TEMP/nf-test/collected_errors/:"
          tree -a $RUNNER_TEMP/nf-test/collected_errors/

      - name: Upload error workdirs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: error_workdirs
          path: ${{ runner.temp }}/nf-test/collected_errors

      # Selenium pytest test_reports.py requires all reports in a dir
      - name: Soft link reports for pytest
      # Always run, nothing will happen if there are no reports in output
        if: always()
        run: |
          src_dir=$TEST_DIR/output
          echo "Dir to be searched $src_dir"

          dest_dir=$TEST_DIR/output/reports
          echo "Reports will be soft linked to dir $dest_dir"

          mkdir -p $dest_dir

          # Find all "report*.html" files and link them into dest_dir
          find "$src_dir" -type f -name "report*.html" | while IFS= read -r file; do
              base_name=$(basename "$file")
              dest_path="$dest_dir/$base_name"

              # Skip if link or file already exists
              if [[ -e "$dest_path" ]]; then
                  echo "Skipping: $dest_path already exists."
                  continue
              fi

              ln -s "$file" "$dest_path"
              echo "Linked: $file -> $dest_path"
          done

          echo "#### tree $TEST_DIR/output/reports"
          tree $TEST_DIR/output/reports

        # Install pytest and dependencies for running selenium
      - name: Install and run pytest
        if: always()
        run: |
          set +e
          
          cd test/selenium
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

          reports_dir=$TEST_DIR/output/reports

          # Check if the folder contains at least one report
          if [ -n "$(find "$reports_dir" -mindepth 1 -print -quit)" ]; then
            echo "Running pytest"
            pytest test_reports.py -v --dir "$reports_dir"
            echo "Running ./testkit.py render"
            ./testkit.py render
          else
              echo "Reports folder is empty."
          fi

      - name: Upload review.html
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review.html
          path: ${{ github.workspace }}/test/selenium/review.html