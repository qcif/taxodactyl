# Example custom configuration
# This shows how to override default values for a specific analysis

# Analysis-specific parameters
blast_max_target_seqs: 3000
bold_database: "COX1_SPECIES"

# Input validation settings
inputs:
  fasta_max_sequences: 200  # Allow more sequences than default
  fasta_max_length_nt: 4000  # Allow longer sequences
  facility_name: "Custom Research Lab"
  analyst_name: "Dr. Jane Smith"

# Stricter analysis criteria for high-confidence results
criteria:
  alignment_min_identity: 0.95  # More stringent than default 0.935
  alignment_min_q_coverage: 0.90  # Higher coverage requirement
  max_candidates_for_analysis: 5  # More candidates for analysis
  sources_min_count: 10  # Require more sources

# GBIF settings for occurrence data
gbif_limit_records: 1000
gbif_max_occurrence_records: 10000

# Report customization
report:
  title: "High-Confidence Taxonomic Identification Report"
  debug: false
  database_name: "Custom NCBI Database"

# Database coverage thresholds
db_coverage_toi_limit: 15
db_coverage_max_candidates: 5