{% from "macros/subjective.html" import render_subjective_input %}

<h2>Final conclusion</h2>

{% include 'components/conclusion-checklist.html' %}

<div class="my-5">
  <textarea
    class="form-control"
    name="subjectiveFinal"
    id="subjectiveFinal"
    rows="4"
    placeholder="Concluding remarks"
  ></textarea>
</div>

<hr class="my-5" />

<section id="analystNotes">
  <h3>Analyst notes:</h3>

  <div class="analyst-summary my-5" id="analystSummary-1">
    <h3>Summary</h3>
    <p></p>
  </div>
  <div class="analyst-summary my-5" id="analystSummary-2">
    <h3>Candidate species</h3>
    <p></p>
  </div>
  <div class="analyst-summary my-5" id="analystSummary-3">
    <h3>Taxa of interest</h3>
    <p></p>
  </div>

  <hr class="my-5" />
</section>

{% include "components/taxonomy-check.html" %}

<script>
  // Collect all subjective inputs and display them as read-only summaries

  $("#conclusions-tab").click(() => {
    let analystNotes = false;
    $('textarea[id^="subjective-"]').each((ix, el) => {
      const index = ix + 1;
      if (el.value.trim() !== "") {
        $(`#analystSummary-${index} p`).text(el.value);
        $(`#analystSummary-${index}`).show();
        analystNotes = true;
      } else {
        $(`#analystSummary-${index}`).hide();
      }
    });
    if (analystNotes) {
      $("#analystNotes").show();
    } else {
      $("#analystNotes").hide();
    }
  });
</script>
